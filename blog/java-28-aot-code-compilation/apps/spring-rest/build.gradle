plugins {
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.graalvm.buildtools.native' version '1.1.14'
}

dependencies {
    // MVC + JPA/Hibernate + validation + actuator: the same app shape as the JEP 516 post,
    // plus CPU-heavy endpoints so there is real code for the JIT (and JEP 544) to compile.
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'com.h2database:h2'
}

bootJar { archiveFileName = 'spring-rest.jar' }

// Native image comparison build. Uses $GRAALVM_HOME directly instead of a Gradle toolchain
// lookup so it works with any GraalVM install location (see scripts/native-build.sh).
graalvmNative {
    toolchainDetection = false
}
