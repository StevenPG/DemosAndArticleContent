spring:
  application:
    name: maintenance-service

  datasource:
    url: jdbc:postgresql://localhost:5432/partition_swap
    username: demo
    password: demo
    hikari:
      # One connection for the promotion in flight, a couple for the read API.
      maximum-pool-size: 4

  jpa:
    # The ingest service owns the schema (Flyway); Hibernate must never touch DDL.
    hibernate:
      ddl-auto: none
    open-in-view: false

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

maintenance:
  # :00 the minute ends -> grace covers in-flight COPYs -> :10 the scheduler
  # indexes, bounds-checks, analyzes, and attaches the completed minute.
  swap-cron: "10 * * * * *"
  grace-seconds: 5
  # Never let the attach park in the parent's lock queue for more than this;
  # a parked ACCESS-level waiter would block every query that queues behind it.
  attach-lock-timeout-ms: 2000
  attach-attempts: 5
  retention-cron: "40 * * * * *"
  retention:
    enabled: true
    # Plenty for a demo session; drops old minutes so a long-running demo
    # doesn't accumulate hundreds of partitions.
    max-age-minutes: 120

logging:
  level:
    com.example.partitionswap: INFO
    # Flip to DEBUG to see every DDL statement the swap executes.
    # com.example.partitionswap.maintenance.swap: DEBUG
