spring.application.name=java27-defaults-bench
server.port=8080

management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.probes.enabled=true

# The live set. 20,000 aircraft x 100 retained positions = 2,000,000 Position
# records plus their deques and map entries. Sized so the legacy-header live
# set is roughly half of the default max heap in a 1 GiB container
# (MaxRAMPercentage=25 -> ~256 MiB), which is where GC choice starts to matter.
bench.aircraft=20000
bench.positions-per-aircraft=100
