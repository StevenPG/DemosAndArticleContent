# Single-node kind cluster on Kubernetes 1.37.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0
    kubeadmConfigPatches:
      - |
        kind: KubeletConfiguration
        # Only matters on a cgroup v1 host (some CI and cloud sandboxes): since
        # 1.35 the kubelet refuses to start on cgroup v1 unless told otherwise.
        # Docker Desktop and current Linux distros are cgroup v2 and ignore this.
        failCgroupV1: false
