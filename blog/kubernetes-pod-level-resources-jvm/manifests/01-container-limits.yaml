# Baseline: every container has its own limit, the way pods are sized today.
# The JVM sizes its heap from its own 1 GiB limit; the sidecar is boxed at 64 MiB.
# GENERATED by scripts/gen-manifests.py
apiVersion: v1
kind: Pod
metadata:
  name: container-limits
  labels: {scenario: container-limits}
spec:
  restartPolicy: Never
  initContainers:
    # Native sidecar (restartPolicy: Always): shares the pod budget, stops when the app exits.
    - name: log-shipper
      image: busybox:1.37
      restartPolicy: Always
      command: ["sh", "-c", "touch /hog/ready && while true; do sleep 5; done"]
      resources:
        limits: {cpu: 100m, memory: 64Mi}
      # A native sidecar's startupProbe gates the app container: the JVM starts only after
      # the sidecar is holding its memory.
      startupProbe:
        exec: {command: ["test", "-f", "/hog/ready"]}
        periodSeconds: 1
        failureThreshold: 60
      volumeMounts:
        - name: hog
          mountPath: /hog
  containers:
    - name: app
      image: eclipse-temurin:25-jdk
      command: ["java", "/probe/ResourceProbe.java", "allocate"]
      env:
        - name: CONTAINER_NAME
          value: app
        # What most production JVM images set: heap = 75% of whatever memory the JVM can see.
        - name: JAVA_TOOL_OPTIONS
          value: "-XX:MaxRAMPercentage=75"
      resources:
        requests: {cpu: "1", memory: 1Gi}
        limits: {cpu: "1", memory: 1Gi}
      volumeMounts:
        - name: probe
          mountPath: /probe
  volumes:
    - name: probe
      configMap:
        name: resource-probe
    # In-memory scratch space; tmpfs pages are charged to the container that writes them.
    - name: hog
      emptyDir: {medium: Memory, sizeLimit: 512Mi}
