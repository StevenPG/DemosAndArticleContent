spring.application.name=ops-toolbox-demo

# --- MCP server --------------------------------------------------------------
# STATELESS: every JSON-RPC request is self-contained over Streamable HTTP. No
# session affinity, so any replica behind a plain load balancer can answer.
# The trade-off: no server-initiated messages (sampling, elicitation, progress).
spring.ai.mcp.server.name=ops-toolbox
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=STATELESS
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.instructions=Operational tools for one running Spring Boot instance: health, metrics, HTTP traffic, recent logs, JVM and thread state. Start with get_health, then http_traffic_summary, then recent_logs.

# --- Guard rails for the ops tools -----------------------------------------
# Leave blank to generate one at startup (it is logged once).
ops.mcp.api-key=${OPS_MCP_API_KEY:}
# Loggers set_log_level_temporarily may touch. Deliberately not ROOT.
ops.mcp.writable-logger-prefixes=com.stevenpg,org.springframework.web
ops.mcp.log-buffer-size=2000

# --- Actuator ------------------------------------------------------------------
# The MCP tools use the actuator beans in-process; nothing here needs to be
# exposed over HTTP for them to work.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always

# --- Demo API fault injection -----------------------------------------------
demo.failure-rate=0.05
demo.slow-rate=0.05
